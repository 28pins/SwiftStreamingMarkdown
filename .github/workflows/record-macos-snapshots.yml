name: Record macOS Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record-snapshots:
    name: Record macOS Snapshots
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable recording mode
        run: |
          sed -i '' 's|// isRecording = true|isRecording = true|' \
            Tests/MarkdownTextTests/SnapshotTestFoundation/SnapshotTestCase.swift

      - name: Record macOS snapshots
        run: |
          xcodebuild test \
            -scheme SwiftStreamingMarkdown \
            -destination "platform=macOS" \
            -skipMacroValidation \
            -disable-concurrent-testing \
            || true

      - name: Collect recorded snapshots
        run: |
          mkdir -p /tmp/recorded-snapshots
          find Tests/MarkdownTextTests/__Snapshots__ -name "*macOS*" -exec cp {} /tmp/recorded-snapshots/ \;
          echo "Recorded $(ls /tmp/recorded-snapshots/*.png | wc -l) macOS snapshots"
          ls /tmp/recorded-snapshots/

      - name: Upload recorded snapshots
        uses: actions/upload-artifact@v4
        with:
          name: macos-snapshots
          path: /tmp/recorded-snapshots/
          retention-days: 3
