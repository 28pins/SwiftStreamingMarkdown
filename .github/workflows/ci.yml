name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint if missing
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "SwiftLint not found, installing via Homebrew..."
            brew install swiftlint
          fi
          swiftlint version

      - name: Run SwiftLint
        run: swiftlint --strict

  spm-unit-tests:
    name: SPM Unit Tests (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: iOS
            destination: "platform=iOS Simulator,OS=26.4.1,name=iPhone 17"
            skip-testing: ""
          - platform: macOS
            destination: "platform=macOS"
            # Snapshot tests are skipped on macOS CI because they use
            # CGWindowListCreateImage, which requires Screen Recording
            # permission unavailable on CI runners.
            skip-testing: >-
              -skip-testing:SwiftStreamingMarkdownTests/MarkdownTextSnapshotTests
              -skip-testing:SwiftStreamingMarkdownTests/BlockQuoteViewSnapshotTests
              -skip-testing:SwiftStreamingMarkdownTests/TableViewSnapshotTests
              -skip-testing:SwiftStreamingMarkdownTests/TableViewTests
              -skip-testing:SwiftStreamingMarkdownTests/OrderedListViewTests
              -skip-testing:SwiftStreamingMarkdownTests/UnorderedListViewTests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run package tests with xcodebuild
        run: |
          xcodebuild test \
            -scheme SwiftStreamingMarkdown \
            -destination "${{ matrix.destination }}" \
            -skipMacroValidation \
            ${{ matrix.skip-testing }}

  sample-app-build:
    name: Sample App Build (${{ matrix.platform }})
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - platform: iOS
            scheme: SwiftStreamingMarkdownSample
            destination: "platform=iOS Simulator,OS=26.4.1,name=iPhone 17"
          - platform: macOS
            scheme: SwiftStreamingMarkdownSampleMac
            destination: "platform=macOS"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen if missing
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "XcodeGen not found, installing via Homebrew..."
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate sample app project
        run: make generate-sample-project

      - name: Build sample app
        run: |
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all \
          xcodebuild build \
            -project Examples/SwiftStreamingMarkdownSample/SwiftStreamingMarkdownSample.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
